# build Apache Thrift on Travis CI - https://travis-ci.com/

# Sealed build (org.apache.thrift:libthrift): upstream's matrix runs every leg
# inside build/docker/run.sh after `travis_wait 40 build/docker/refresh.sh`,
# which rebuilds the full polyglot thrift-build image from source and does not
# reach a verdict on the fork. This config instead runs the Java library's own
# suite the way upstream's lib-java-kotlin job in .github/workflows/build.yml
# does: autotools configure with Java, build the compiler, then
# `make -C lib/java` and `make -C lib/java check` (= gradle test).

dist: jammy
language: minimal

env:
  global:
    - GRADLE_VERSION="8.4"
    - BUILD_DEPS="automake bison flex git libboost-all-dev libevent-dev libssl-dev libtool make pkg-config"
    - JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    # the jammy image preinstalls Gradle 9.x in /usr/local/gradle; put upstream CI's Gradle 8.4 first on PATH
    - PATH=/opt/gradle-8.4/bin:/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH

install:
  - sudo apt-get update -yq
  - sudo apt-get install -y --no-install-recommends g++ $BUILD_DEPS openjdk-17-jdk-headless wget unzip ant
  - java -version
  - wget https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip -q -O /tmp/gradle-$GRADLE_VERSION-bin.zip
  - (echo "3e1af3ae886920c3ac87f7a91f816c0c7c436f276a6eefdb3da152100fef72ae  /tmp/gradle-$GRADLE_VERSION-bin.zip" | sha256sum -c -)
  - sudo unzip -q -d /opt /tmp/gradle-$GRADLE_VERSION-bin.zip
  - which gradle
  - gradle --version
  - mkdir -p ~/.gradle/init.d && cp .travis/test-logging.gradle ~/.gradle/init.d/

jobs:
  include:
    - name: "Java library (lib/java) - make check"
      script:
        - ./bootstrap.sh
        - ./configure --disable-debug --disable-dependency-tracking --without-cpp --without-c_glib --with-java --without-kotlin --without-python --without-py3 --without-ruby --without-haxe --without-netstd --without-perl --without-php --without-php_extension --without-dart --without-erlang --without-go --without-d --without-nodejs --without-nodets --without-lua --without-rs --without-swift
        - make -j2 -C compiler/cpp
        - compiler/cpp/thrift -version
        - make -C lib/java
        - make -C lib/java check
      after_script:
        - sh .travis/wait-for-log.sh
